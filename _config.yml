title: BeSafeShare

# `description` becomes <meta name="description"> and og:description on every
# page - the snippet a search engine shows and the preview a chat client
# renders. It carried the Jekyll scaffold placeholder on all 48 pages.
description: >-
  Common Glossary and logical data models for the Belgian CareSets.

# The address the pages already give for change requests, in 36 places. Kept
# here so the site declares one contact rather than two.
email: Besafeshare@riziv-inami.fgov.be
author: BeSafeShare team

domain: caresets.github.io
url: https://caresets.github.io
# The path the public site is served under: https://caresets.github.io/caresets/
# It follows the repository name. publish.yml overrides it on every build: the
# main site gets /<repo>, a branch preview /<repo>/branches/<branch>.
baseurl: /caresets

# Build settings
theme: just-the-docs
remote_theme: pmarsceill/just-the-docs
plugins:
  - jekyll-default-layout
  - jekyll-spaceship  

color_scheme: wider

search_enabled: false

logo: "/assets/images/besafeshare.png"

# Exclude from processing
#
# Anything not listed here is copied verbatim into _site and deployed. Content
# sources, working files and build scripts are NOT site content - keep them out.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - old_docs
  - node_modules/
  - README.md
  - SECURITY-HEADERS.md
  - DELIVERY-NOTE.md
  - HANDOVER-DISCLAIMER.md
  - MAPPING-PROCEDURE.md
  - workbench.bat
  # A build-time dependency list. Jekyll copies any root file it is not told to
  # exclude, so this was being published with the site.
  - requirements.txt
  # Handed to the eHealth IGs, not served by this site.
  - exports/
  # The built deliverable itself. Left in the root between builds it would be
  # copied into the next one, so the package would contain a stale copy of a
  # previous package.
  - "*.zip"
  - vendor/bundle/
  - vendor/
  - vendor/cache/

  # Authored content. _resources/ is generated from this and is what the site
  # serves (see the `include:` below), so the sources themselves stay out.
  - input/

  # Generated deliverables and working files.
  - models/
  - glossary-changes/
  - archive/

  # Pages disabled by renaming. Jekyll still renders and publishes these
  # unless excluded - unlinked, but reachable by URL.
  - "*.mdNO"
  - "**/*.mdNO"

  # Models still marked `draft` by the eHealth export. Nothing links to them -
  # the All Models list is built from /_resources/models/StructureDefinition-,
  # which a draft's path does not match - but the files would still ship and be
  # reachable by direct URL. Publishing draft terminology invites "is this
  # approved?", and "it is not linked" is a weak answer. Delete this line when
  # they are published for real; they stay in input/models/draft/ either way.
  - _resources/models/draft/

  # Generated working files. generate_glossary.py writes timestamped backups
  # beside the CodeSystems; they are internal history, not deliverable content.
  - "*.backup.json"
  - "_resources/glossary/*.backup.json"

  # Export libraries for formats that are switched off in `exports:` above.
  # Jekyll copies assets wholesale, so without this they ship unreferenced -
  # 2.1 MB of third-party code in the deliverable that no page loads.
  # Re-enable a format above AND delete its line here, together.
  - assets/js/vendor/pdfmake-0.2.7.min.js
  - assets/js/vendor/pdfmake-vfs_fonts-0.2.7.js
  - assets/js/vendor/jszip-3.10.1.min.js
  - assets/js/vendor/buttons.print-2.4.2.min.js

  # Build tooling.
  - lib/
  - __pycache__/
  - "*.py"
  - "*.bat"
  - VERSION
  - notes.txt
  - "Logical Model Template.xlsx"

# Hide the Status column on glossary tables (the Concept Status page always shows it).
# Set to true to show Status everywhere, or override per page with `show_status:` front matter.
glossary_show_status: false

# Table export formats.
#
# Excel needs JSZip (~98 KB) and PDF needs pdfMake + its font file (~2.15 MB).
# Both are third-party libraries that would otherwise load on every page,
# including pages with no table. Turning a format off removes its option from
# the download menu AND stops its library being served at all.
#
# csv and markdown need no extra library: csv comes from the DataTables Buttons
# HTML5 module already loaded, markdown is generated by our own code.
exports:
  csv: true
  markdown: true
  excel: false
  pdf: false
  print: false

# Not-public mode. true adds a noindex meta, a robots.txt that disallows
# everything, and a "restricted distribution" banner on every page.
#
# It does NOT restrict access. The pages and the JSON under _resources/ stay
# reachable by anyone with the URL; a password prompt in the site's own
# JavaScript would not change that, because the content is served as plain
# files. Real access control is a web-server setting - see "Restricting access"
# in DELIVERY-NOTE.md.
restricted: false

# Content version
content_version: "0.9.0"

# The footer is composed in _includes/footer_custom.html from
# content_version above, so the version lives in one place. The theme
# renders footer_content as a literal string, which would be a second copy.

aux_links_new_tab: true
heading_anchors: true

gh_edit_link: false
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/caresets/glossary"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

include: 
  - "_resources"

# Clean URLs based on file path
permalink: pretty

# # Collections for each language
# collections:
#   en:
#     output: true
#     permalink: /en/:path/
#   fr:
#     output: true
#     permalink: /fr/:path/
#   nl:
#     output: true
#     permalink: /nl/:path/

# Auto-set lang for each collection
defaults:
  # Disable the just-the-docs auto child-page "Table of contents" on all pages
  - scope:
      path: ""
    values:
      has_toc: false

  - scope:
      path: "en"
    values:
      lang: en

  - scope:
      path: "fr"
    values:
      lang: fr

  - scope:
      path: "nl"
    values:
      lang: nl

  # Exclude model-docs from navigation (they are loaded dynamically)
  - scope:
      path: "_resources/model-docs"
    values:
      nav_exclude: true
      search_exclude: true

# Language configuration
languages:
  - code: en
    name: English
    flag: 🇬🇧
  - code: fr
    name: Français
    flag: 🇫🇷
  - code: nl
    name: Nederlands
    flag: 🇳🇱
